name: dheet
# Local services for development. The app itself runs on the host (`bun run api`, `bun run worker`) against
# one SQLite file (DATABASE_PATH, default .data/dithub.sqlite); there is no database server.
services:
  bee:                               # Swarm: a throwaway in-memory Bee in dev mode (no chain, no peers, free stamps)
    image: ethersphere/bee:1.17.6    # last release with `bee dev`; production runs a 2.x light node
    command: ["dev", "--api-addr=:1633", "--cors-allowed-origins=*"]
    ports: ["127.0.0.1:1633:1633"]
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    env_file: .env
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  objectstore:                       # S3-compatible (SeaweedFS). Enable with: --profile storage
    profiles: ["storage"]
    image: chrislusf/seaweedfs:latest
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-master.volumeSizeLimitMB=1024"]
    ports: ["127.0.0.1:8333:8333", "127.0.0.1:9333:9333"]
    volumes: ["objectdata:/data"]
    restart: unless-stopped
  meilisearch:
    image: getmeili/meilisearch:v1.12
    env_file: .env
    environment: { MEILI_ENV: development, MEILI_NO_ANALYTICS: "true" }
    ports: ["127.0.0.1:7700:7700"]
    volumes: ["meilidata:/meili_data"]
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
    restart: unless-stopped
volumes: { redisdata: {}, objectdata: {}, meilidata: {} }
