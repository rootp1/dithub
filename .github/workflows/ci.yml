name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: oven-sh/setup-bun@v2.0.1
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build   # also produces apps/web/dist, which the web verify tests compare against
      - run: bun test packages/sdk/test packages/e2e/local-flow.test.ts packages/dit apps/web/src
      - name: Build production web bundle (deterministic build.json)
        run: GIT_COMMIT=${{ github.sha }} bun apps/web/build.ts

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: foundry-rs/foundry-toolchain@v1.5.0
        with:
          version: v1.9.0
      - run: forge test --root packages/contracts -vv
